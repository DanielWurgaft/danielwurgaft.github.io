# Papers on the site. Rebuild with:  uv run python scripts/build_papers.py
# (also runs weekly via .github/workflows/papers.yml)
#
# selected: shown at the top with figure-1 thumbnails. Fixed: only what's listed here.
# exclude:  hidden from the auto-updating "All papers" list (which is everything
#           on the Semantic Scholar profile).
# Papers are keyed by arXiv id (or Semantic Scholar paperId if not on arXiv).

author_id: "2387864918"   # https://www.semanticscholar.org/author/2387864918

selected:   # shown in this order
  - "2506.17859"   # In-Context Learning Strategies Emerge Rationally
  - "2511.00617"   # Belief Dynamics
  - "2605.05115"   # Manifold Steering
  - "2505.23931"   # Scaling up the think-aloud method

exclude:
  - "c28d141699e32b99ef7bd76c221f38f9baec3081"   # Reliability Scales Inversely
  - "7106400db820d82770923f5524b6ab0255741cd3"   # Biological Psychiatry conference abstract (639. Distinct Neural Correlates…)

# Full names for co-authors that Semantic Scholar lists with initials.
# Applied to every paper, including ones added later.
names:
  "E. Lubana": "Ekdeep Singh Lubana"
  "J. B. Tenenbaum": "Joshua B. Tenenbaum"
  "G. Reddy": "Gautam Reddy"
  "C. Park": "Core Francisco Park"
  "M. Kowal": "Matthew Kowal"
  "C. Rager": "Can Rager"

# Per-paper tweaks. Any field can be overridden: title, venue, year, url.
#   links:  extra links shown after "pdf", e.g. {code: https://github.com/...}
#   figure: a path to your own image (e.g. img/papers/custom.png), or "none"
#   equal:  positions (0 = first) of co-first authors, marked with * (from Google Scholar)
overrides:
  "2506.17859":   # code is linked from the NeurIPS version, not arXiv
    equal: [0, 1]
    links: {code: "https://github.com/DanielWurgaft/rational-icl"}
  "2511.00617":
    equal: [0, 1]
    venue: ICML
    year: 2026
  "2605.05115":
    equal: [0, 1, 2]
    venue: COLM
    year: 2026
    links: {code: "https://github.com/goodfire-ai/causalab/tree/manifold_steering"}
  "2505.23931":
    equal: [0, 1]
    links: {code: "https://github.com/benpry/think-aloud-llms"}
  "2604.28119":   # Do Sparse Autoencoders Capture Concept Manifolds?
    venue: COLM
    year: 2026
  "2605.01148":   # title + venue as on Google Scholar
    title: "Arithmetic in the Wild: Llama uses Standard Addition to Reason About Cyclic Concepts"
    venue: COLM
    year: 2026
  "a4a7f90bf263c6006be24aa702c312012e734b73":   # Alexithymia (not on arXiv): figure supplied by hand
    figure: img/papers/alexithymia.webp
