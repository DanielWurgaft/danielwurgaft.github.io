name: Update papers

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    paths: [papers.yaml]   # rebuild when you edit the selection

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python scripts/build_papers.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html img/papers
          git diff --cached --quiet || (git commit -m "Update papers" && git push)
